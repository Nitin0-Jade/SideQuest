{% extends "layout.html" %}

{% block title %}
Find a Ride
{% endblock %}

{% block main %}

<section class="sq-ride-finder">

<!-- HERO -->
<div class="sq-ride-finder-hero">

    <div class="sq-eyebrow">
        MOBILITY // FIND YOUR ROUTE
    </div>

    <h1 class="sq-ride-finder-title">
        Find your
        <span>ride.</span>
    </h1>

    <p class="sq-ride-finder-subtitle">
        Enter your route and travel date to find students already
        heading the same way.
    </p>

</div>


<!-- SEARCH PANEL -->
<div class="sq-ride-search-panel">

    <div class="sq-ride-search-heading">

        <span class="sq-panel-kicker">
            ROUTE SEARCH
        </span>

        <h2>
            Where are you going?
        </h2>

    </div>


    <form
        action="/findride"
        method="post"
        class="sq-ride-search-form"
    >

        <div class="sq-ride-search-field">

            <label for="origin">
                FROM
            </label>

            <div class="sq-input-wrap">
                <span class="sq-input-icon">●</span>

                <input
                    id="origin"
                    name="origin"
                    type="text"
                    placeholder="e.g. Hostel"
                    required
                >
            </div>

        </div>


        <div class="sq-search-arrow">
            →
        </div>


        <div class="sq-ride-search-field">

            <label for="destination">
                TO
            </label>

            <div class="sq-input-wrap">
                <span class="sq-input-icon">◆</span>

                <input
                    id="destination"
                    name="destination"
                    type="text"
                    placeholder="e.g. Railway Station"
                    required
                >
            </div>

        </div>


        <div class="sq-ride-search-field sq-ride-date-field">

            <label for="travel_date">
                DATE
            </label>

            <input
                id="travel_date"
                name="travel_date"
                type="date"
                required
            >

        </div>


        <button
            type="submit"
            class="btn btn-primary sq-find-button"
        >
            Find Rides →
        </button>

    </form>

</div>
